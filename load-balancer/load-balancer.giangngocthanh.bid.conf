upstream backend {
    # least_conn;
    # ip_hash;
    server 172.31.8.253:8080;
    server 172.31.4.219:8080;
    server 127.0.0.1:5003;
}

server {
    listen 80;
    listen [::]:80;

    server_name load-balancer.giangngocthanh.bid;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name load-balancer.giangngocthanh.bid;

    ssl_certificate /etc/nginx/ssl/giangngocthanh.bid.crt;
    ssl_certificate_key /etc/nginx/ssl/giangngocthanh.bid.key;

    location / {
        proxy_pass http://backend;
        include proxy_params;
    }
}
