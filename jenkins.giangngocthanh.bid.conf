server {
    listen 80;
    listen [::]:80;

    server_name jenkins.giangngocthanh.bid;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name jenkins.giangngocthanh.bid;

    ssl_certificate /etc/nginx/ssl/giangngocthanh-public.crt;
    ssl_certificate_key /etc/nginx/ssl/giangngocthanh-private.key;

    location / {
        proxy_pass http://0.0.0.0:8080;
        include proxy_params;
    }
}
