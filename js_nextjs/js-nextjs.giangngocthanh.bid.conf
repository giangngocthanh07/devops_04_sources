server {
    listen 80;
    listen [::]:80;

    server_name js-nextjs.giangngocthanh.bid;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name js-nextjs.giangngocthanh.bid;

    ssl_certificate /etc/nginx/ssl/giangngocthanh.bid.crt;
    ssl_certificate_key /etc/nginx/ssl/giangngocthanh.bid.key;

    location / {
        proxy_pass http://0.0.0.0:3001;
        include proxy_params;
    }
}
